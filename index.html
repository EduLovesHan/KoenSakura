<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorrido Virtual - Villa Sakura</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="js/main.js"></script>

 <!-- menu de opciones -->
    <button id="btn-menu-superior">
         <img src="assets/texturas/otros/sakura.png" class="icono-sakura">
    </button>
    
    <div id="panel-menu-superior" class="oculto">
        <h3>Menu</h3>
        <div class="botones-fila">
            <button class="btn-opcion" data-tab="general">General</button>
            <button class="btn-opcion" data-tab="descripcion">Ayuda</button>
            <button class="btn-opcion" data-tab="controles">Controles</button>
        </div>
        <div class="botones-fila">
            <button class="btn-opcion" data-tab="sonido">Sonido</button>
            <button class="btn-opcion" data-tab="creditos">Creditos</button>
        </div>

        <div id="tab-sonido" class="tab-contenido oculto">
            <div class="control-grupo">
                <label>Música</label>
                <div class="slider-con-mute">
                    <input type="range" id="musica-slider" min="0" max="1" step="0.01" value="0.3">
                    <label><input type="checkbox" id="musica-mute"> Mute</label>
                </div>
            </div>
            <div class="control-grupo">
                <label>SFX</label>
                <div class="slider-con-mute">
                    <input type="range" id="sfx-slider" min="0" max="2" step="0.01" value="1.5">
                    <label><input type="checkbox" id="sfx-mute"> Mute</label>
                </div>
            </div>
        </div>

        <div id="tab-controles" class="tab-contenido oculto">
            <div><strong>W A S D</strong> - Moverse</div>
            <div><strong>Ratón</strong> - Mirar alrededor</div>
            <div><strong>Click</strong> - Bloquear/Desbloquear cámara</div>
        </div>
    </div>

</body>
</html>
